name: PDF 책갈피 APK 만들기

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Android SDK 준비
        uses: android-actions/setup-android@v4

      - name: Android SDK 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: 프로젝트 압축 풀기
        run: |
          mkdir -p project
          unzip -o PDFBookmarkSimple_AndroidStudio.zip -d project
          sed -i 's/VERSION_1_8/VERSION_17/g' project/app/build.gradle
            - name: APK 빌드
        working-directory: project
        run: gradle assembleDebug -Pkotlin.jvm.target.validation.mode=warning
        uses: actions/upload-artifact@v4
        with:
          name: PDF-책갈피-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
